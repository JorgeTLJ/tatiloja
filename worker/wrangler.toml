name = "tatiloja-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Endereço do site (sem barra no final).
SITE_URL = "https://tatiloja.com.br"
# Sites que podem chamar este servidor.
ALLOWED_ORIGINS = "https://jorgetlj.github.io,https://tatiloja.com.br,https://www.tatiloja.com.br"
# Repositório privado onde as vendas são gravadas.
DATA_REPO = "JorgeTLJ/tldados"
# Máximo de parcelas no cartão.
MAX_INSTALLMENTS = "6"
# "1" recusa avisos do Mercado Pago com assinatura inválida (ligar depois de confirmar que funciona).
STRICT_SIGNATURE = "0"

# CEP da loja (origem do frete): Rua Doutor Ferreira Lopes, 659.
ORIGIN_CEP = "04671011"
# Contato técnico enviado ao Melhor Envio (opcional; e-mail da loja).
ME_CONTACT = ""

# Segredos (NÃO ficam aqui; são criados no painel da Cloudflare):
#   MP_ACCESS_TOKEN     token de produção do Mercado Pago
#   MP_WEBHOOK_SECRET   chave secreta dos avisos (webhooks) do Mercado Pago
#   GH_TOKEN            token do GitHub com acesso só ao repositório tldados
#   ME_TOKEN            token do Melhor Envio (cotação de frete PAC/SEDEX); sem ele vale a tabela de regiões
#   NOTIFY_EMAIL        e-mail que recebe o aviso de venda (o mesmo da conta no Resend)
#   RESEND_API_KEY      chave do Resend (aviso de venda por e-mail)
#   NTFY_TOPIC          nome secreto do canal no app ntfy (aviso de venda no celular)
